name: CI

on:
  push:
    branches: [main, phase-1, phase-2-fcitx5]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Fcitx5 dev (cho --all-features)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.92"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install Fcitx5 dev (cho --all-features)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Test all features
        run: cargo test --all-targets --all-features
      - name: Check release
        run: cargo check --release --all-features

  feature-gates:
    name: feature gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fcitx5 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: no-default-features
        run: cargo check --no-default-features
      - name: no-default-features test
        run: cargo test --no-default-features
      - name: app only
        run: cargo check --features app
      - name: fcitx5 only
        run: cargo check --no-default-features --features fcitx5

  canonical-build:
    name: canonical build (no Slint in .so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fcitx5 dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libfcitx5utils-dev libfcitx5config-dev
      - name: Build addon (.so, target/fcitx)
        run: |
          CARGO_TARGET_DIR=target/fcitx \
          cargo build --release --lib --no-default-features --features fcitx5
      - name: Build app binary (target/app)
        run: |
          CARGO_TARGET_DIR=target/app \
          cargo build --release --bin cantype --no-default-features --features app
      - name: Verify .so has no Slint
        run: |
          if ldd target/fcitx/release/libcantype.so | grep -i slint; then
            echo "LOI: .so link Slint" >&2
            exit 1
          fi
          if nm -C target/fcitx/release/libcantype.so | grep -i slint; then
            echo "LOI: .so co symbol Slint" >&2
            exit 1
          fi
      - name: Verify app has no Fcitx5
        run: |
          if ldd target/app/release/cantype | grep -i fcitx; then
            echo "LOI: app link Fcitx5" >&2
            exit 1
          fi
      - name: Verify .so exports
        run: |
          nm -D target/fcitx/release/libcantype.so | grep -E \
            "cantype_phien_(tao|giai_phong|dat_lai)|cantype_xu_ly_phim|fcitx_addon_factory_instance"

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features
