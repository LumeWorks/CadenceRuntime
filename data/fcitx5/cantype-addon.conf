# Metadata addon Fcitx5 cho CanType. Cài vào
# ~/.local/share/fcitx5/addon/cantype.conf (user) hoặc
# /usr/share/fcitx5/addon/cantype.conf (system).
#
# `Library=libcantype` — Fcitx5 tìm `libcantype.so` trong addondir
# (FCITX_ADDON_DIRS hoặc /usr/lib/x86_64-linux-gnu/fcitx5/). Fcitx5 không quét
# ~/.local/lib/fcitx5/ mặc định — cần set FCITX_ADDON_DIRS hoặc cài system.
# Quy ước Fcitx5: Library là tên file đầy đủ (có prefix `lib`, không `.so`).

[Addon]
Name=CanType
Category=InputMethod
Version=0.1.0
Enabled=True
Library=libcantype
Type=SharedLibrary
OnDemand=True
Configurable=False
[Dependencies]
0=core:5.0.0
