# Metadata input method Fcitx5 cho CanType. Cài vào
# ~/.local/share/fcitx5/inputmethod/cantype.conf (user) hoặc
# /usr/share/fcitx5/inputmethod/cantype.conf (system).
#
# `Addon=cantype` tham chiếu tên addon (file config addon không kể `.conf`).
# `LangCode=vi` để Fcitx5 hiển thị trong nhóm tiếng Việt. `Label=VI` là nhãn
# ngắn gọn trên chỉ báo bố cục bàn phím.

[InputMethod]
Name=CanType
Icon=cantype
Label=VI
LangCode=vi
Addon=cantype
