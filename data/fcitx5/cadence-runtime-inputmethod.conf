# Metadata input method Fcitx5 cho CadenceRuntime. Cài vào
# ~/.local/share/fcitx5/inputmethod/cadence-runtime.conf (user) hoặc
# /usr/share/fcitx5/inputmethod/cadence-runtime.conf (system).
#
# `Addon=cadence-runtime` tham chiếu tên addon (file config addon không kể
# `.conf`). `LangCode=vi` để Fcitx5 hiển thị trong nhóm tiếng Việt.

[InputMethod]
Name=CadenceRuntime
Icon=cadence-runtime
LangCode=vi
Addon=cadence-runtime
