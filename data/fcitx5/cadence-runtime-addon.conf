# Metadata addon Fcitx5 cho CadenceRuntime. Cài vào
# ~/.local/share/fcitx5/addon/cadence-runtime.conf (user) hoặc
# /usr/share/fcitx5/addon/cadence-runtime.conf (system).
#
# `Library=cadence_runtime` — Fcitx5 tìm `cadence_runtime.so` trong addondir
# (FCITX_ADDON_DIRS hoặc /usr/lib/x86_64-linux-gnu/fcitx5/). Fcitx5 không quét
# ~/.local/lib/fcitx5/ mặc định — cần set FCITX_ADDON_DIRS hoặc cài system.

[Addon]
Name=CadenceRuntime
Category=InputMethod
Version=0.1.0
Enabled=True
Library=cadence_runtime
Type=SharedLibrary
OnDemand=True
Configurable=False
[Dependencies]
0=core:5.0.0
