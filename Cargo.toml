[package]
name = "cadence-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "Runtime thuần Rust, độc lập nền tảng cho lõi gõ tiếng Việt Cadence"
readme = "README.md"
keywords = ["vietnamese", "input", "ime", "telex", "runtime"]
categories = ["text-processing", "internationalization"]
repository = "https://github.com/LumeWorks/CadenceRuntime"

[lib]
name = "cadence_runtime"
path = "src/lib.rs"

[dependencies]
# Cadence được pin theo full commit SHA, không theo branch, vì Cadence đang
# được phát triển song song và `main` có thể thay đổi bất kỳ lúc nào. Xem
# `docs/PHASE_1_RUNTIME.md` cho lý do chọn SHA này.
cadence = {
    package = "cadence-ime",
    git = "https://github.com/LumeWorks/Cadence",
    rev = "52b3bb49403245e68a5f5291b04741953fd666b6",
}

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
