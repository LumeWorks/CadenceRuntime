[package]
name = "cantype"
version = "0.1.0"
edition = "2024"
# MSRV CanType = 1.92 do GUI Slint (~1.17). Lõi runtime thuần (boundary Cadence,
# phien, host, sua) tương thích 1.85 (đồng bộ Cadence), nhưng package cần 1.92
# vì feature `app` mặc định kéo Slint. Build --no-default-features vẫn cần 1.92
# vì `rust-version` áp dụng cho cả package. Xem commit MSRV này.
rust-version = "1.92"
license = "MPL-2.0"
description = "CanType - bộ gõ tiếng Việt cho Linux và Windows, dùng chung lõi Cadence"
readme = "README.md"
keywords = ["vietnamese", "input", "ime", "telex", "cantype"]
categories = ["text-processing", "internationalization"]
repository = "https://github.com/LumeWorks/CanType"

[lib]
name = "cantype"
path = "src/lib.rs"
# `rlib` cho test và dùng nội bộ; `cdylib` cho addon `.so` Fcitx5. Addon chỉ hoàn
# chỉnh khi build với feature `fcitx5` (compile C++ shim và link Fcitx5Core).
# Khi build feature `app`, cdylib vẫn tạo (libcantype.so) nhưng không link Slint
# (Slint chỉ vào binary `cantype`, không vào lib).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cantype"
path = "src/main.rs"
# Binary chỉ build khi feature `app` bật (Slint dep). `required-features` đảm
# bảo `cargo build` không cố build binary khi thiếu Slint.
required-features = ["app"]

[dependencies]
# Slint GUI + tray. Chỉ kéo khi feature `app` bật (default). Dùng default
# features của Slint (backend-winit + renderer-femtovg cho desktop Linux X11/
# Wayland). `SystemTrayIcon` có sẵn trong default features. Phiên bản ~1.17
# yêu cầu Rust 1.92 (MSRV bump ở trên).
slint = { version = "1.17", optional = true }

# serde + toml: đọc/ghi config.toml schema versioned (§11). serde cho derive
# Serialize/Deserialize; toml cho format. Cả hai là direct dependency (không
# qua Cadence) vì cấu hình là state CanType, không phải Cadence.
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# Cadence được pin theo full commit SHA, không theo branch, vì Cadence đang
# được phát triển song song và `main` có thể thay đổi bất kỳ lúc nào.
#
# Hiện pin `v2026.1.0` (phát hành công khai đầu tiên: Telex + VNI, code/chat
# preservation, NFC/NFD, trace, serde, no_std). Tag `v2026.0.1` trong spec
# Phase 2 không tồn tại trên `LumeWorks/Cadence` (chỉ có `v0.1.0` và
# `v2026.1.0`); sau khi xác minh `git ls-remote --tags`, `v2026.1.0` là bản
# khớp mọi tham chiếu trong spec (VNI, code/chat, NFC/NFD), nên dùng nó thay
# thế và ghi rõ trong commit + báo cáo. Xem `docs/PHASE_1_RUNTIME.md`.
[dependencies.cadence]
package = "cadence-ime"
git = "https://github.com/LumeWorks/Cadence"
# Peeled commit của annotated tag `v2026.1.0` (xem commit cap nhat Cadence).
rev = "a5a586334208a4c084e062f1d77657b07ec3d580"

# Build script: compile C++ shim Fcitx5 và link Fcitx5Core. Chỉ dùng khi feature
# `fcitx5` bật; `cargo test` mặc định (không feature) không cần Fcitx5 dev.
[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }
# slint-build compile .slint file thành Rust module. Chỉ dùng khi feature `app`.
slint-build = { version = "1.17", optional = true }

[features]
# Feature `app` (default): GUI + tray Slint. Binary `cantype` chỉ build khi
# feature này bật. Addon `.so` không kéo Slint (Slint là optional dep chỉ vào
# binary).
# Feature `fcitx5`: bật build C++ shim và link Fcitx5Core thành addon `.so`.
# Không default để `cargo test` mặc định không cần Fcitx5 dev headers.
# `--all-features` bật cả hai (CI Fcitx5 cài dev headers).
# Feature `diag` (Phase 3, không default): bật code diagnostic logging trong
# `tuong_thich`. Trace chỉ chạy khi env `CANTYPE_DEBUG` set. Production build
# không có `diag` → code diagnostic không tồn tại → zero cost trên hot path.
# `--all-features` bật `diag` nhưng test không set env → no-op.
default = ["app"]
app = ["dep:slint", "dep:slint-build"]
fcitx5 = ["dep:cc", "dep:pkg-config"]
diag = []

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
