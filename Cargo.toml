[package]
name = "cadence-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
description = "Runtime thuần Rust, độc lập nền tảng cho lõi gõ tiếng Việt Cadence"
readme = "README.md"
keywords = ["vietnamese", "input", "ime", "telex", "runtime"]
categories = ["text-processing", "internationalization"]
repository = "https://github.com/LumeWorks/CadenceRuntime"

[lib]
name = "cadence_runtime"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
unwrap_used = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
